[package]
name = "blockchain_client_example"
version = "0.0.999"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Example Logos module: polls blockchain_module's chain height through logos-blockchain-client"

[lib]
crate-type = ["staticlib"]

[dependencies]
logos-blockchain-client = { path = "../.." }
logos-rust-sdk = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "b572e8172ca512b41c102d555f00258b859629c0" }
serde_json = "1"
