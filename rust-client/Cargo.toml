[package]
name = "logos-blockchain-client"
version = "0.0.999"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Typed Rust client for the Logos blockchain_module, generated from its LIDL contract"
repository = "https://github.com/logos-blockchain/logos-blockchain-module"

[lib]
name = "logos_blockchain_client"
path = "src/lib.rs"

[dependencies]
logos-rust-sdk = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "a55fdac1a202ff2a4cf9d562a263ab41db17d99f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

lb-core = { package = "logos-blockchain-core", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "6ddfc0b26", default-features = false }
lb-common-http-client = { package = "logos-blockchain-common-http-client", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "6ddfc0b26", default-features = false }
lb-http-api-common = { package = "logos-blockchain-http-api-common", git = "https://github.com/logos-blockchain/logos-blockchain.git", rev = "6ddfc0b26", default-features = false }
