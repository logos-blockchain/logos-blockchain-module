<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --pass: #2ea043; --fail: #f85149; --info: #d29922;
    --code-bg: #0b0f14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .pill.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .pill.skip { background: rgba(210,153,34,.15); color: var(--info); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  main { max-width: 1600px; margin: 0 auto; padding: 16px; }
  .tutorial-title { font-size: 20px; font-weight: 700; margin: 24px 0 8px; color: #fff; }
  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden;
  }
  .row.preamble, .row.section { grid-template-columns: 1fr; }
  .col { padding: 14px 18px; min-width: 0; }
  .col.left { border-right: 1px solid var(--border); }
  .row.preamble .col.left, .row.section .col.left { border-right: none; }
  .col.right { background: var(--panel); }
  /* A row containing any failed step is tinted red end-to-end so it's
     impossible to miss when scanning the report. */
  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
  .row.has-fail .col.left { background: rgba(248,81,73,.07); border-right-color: var(--fail); }
  .row.has-fail .col.right { background: rgba(248,81,73,.12); }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .md :first-child { margin-top: 0; }
  .md h1 { font-size: 22px; } .md h2 { font-size: 18px; } .md h3 { font-size: 15px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .md :not(pre) > code { background: rgba(110,118,129,.2); padding: .15em .4em; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; }
  .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .md img { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .badge.not_run { background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.running { background: rgba(248,81,73,.15); color: var(--fail); }
  .ui-actions { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .ui-actions td { padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .ui-actions td:last-child { white-space: nowrap; color: var(--muted); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }
  pre.cmd, pre.output { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  /* GitHub-style permalinks: every heading carries a link icon in the left
     gutter (revealed on hover/focus) that copies a deep link to that section.
     scroll-margin-top keeps the target clear of the sticky header. */
  .heading-anchored { position: relative; scroll-margin-top: 76px; }
  a.anchor {
    position: absolute; left: -18px; top: 0; width: 16px; height: 1.55em;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); opacity: 0; text-decoration: none;
    transition: opacity .1s ease-in;
  }
  a.anchor svg { width: 14px; height: 14px; display: block; }
  .heading-anchored:hover > a.anchor, a.anchor:focus { opacity: 1; }
  a.anchor:hover { color: var(--accent); }
  .heading-anchored.flash { animation: flash 1.4s ease-out; border-radius: 4px; }
  @keyframes flash {
    from { background: rgba(88,166,255,.28); box-shadow: 0 0 0 4px rgba(88,166,255,.28); }
    to { background: transparent; box-shadow: 0 0 0 4px transparent; }
  }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 14px; font-size: 12.5px; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .15s ease-in-out;
  }
  #toast.show { opacity: 1; }
</style>
</head>

ng path '/nix/store/jrw7q6v8q74hhv43zgpq7i4jmxj9nwlj-stdenv-linux' from 'https://cache.nixos.org'...\ncopying path '/nix/store/36ndhs8khvj8960qbhvw8h3bld1kc06g-qtsvg-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/agvpq5n8vcqwnkmn8bp8rlczy3fdxm6n-qtdeclarative-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/r2cq6la02msp6kfcl9a17d2l2n96qpvs-qtremoteobjects-6.9.2' from 'https://cache.nixos.org'...\ncopying path '/nix/store/jzxspinxhmvfqll4girj7wqgbgxn0ki7-logos-blockchain_module-module-lib-0.0.999' from 'https://logos-co.cachix.org'...\nbuilding '/nix/store/vvxab8as6vn82iqji6srm91hjk1b4g7y-logos-blockchain_module-module-lib-lgx-0.0.999.drv'...\n", "status": "pass"}], "md": "### 2.1 Build the .lgx package\n\n```bash\nnix build 'github:logos-blockchain/logos-blockchain-module/64d8cf5cd4b33b5ef87de31bd96bd2bceae8fb58#lgx' --out-link ./blockchain-lgx\n```"}, {"execs": [], "md": "## Step 3: Install and load the module in the daemon\n\nStart the daemon, install the package into its session, then load\n`blockchain_module`. Loading only brings the plugin into the process \u2014 it\ndoes **not** start a blockchain node."}, {"execs": [{"cmd": "mkdir -p home && HOME=\"$PWD/home\" ./logos/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.1 Start the daemon\n\nThe session directory, `./session`, holds the daemon's config, its\ninstalled modules and their data. `--detach` returns once the daemon\naccepts commands.\n\n```bash\nlogosctl daemon start --detach\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session install --dir ./blockchain-lgx -y", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.2 Install the module\n\n`--dir` installs every `.lgx` in a directory, with no catalog involved.\n`-y` confirms, since there is no terminal to ask on.\n\n```bash\nlogosctl install --dir ./blockchain-lgx -y\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module load blockchain_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.3 Load the module\n\n```bash\nlogosctl module load blockchain_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module show blockchain_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.4 Inspect the methods it exposes\n\n`module show` lists the `Q_INVOKABLE` methods \u2014 the same names you can\n`call`. Note `generate_user_config`, `start`, `stop`, and the\n`wallet_*` family:\n\n```bash\nlogosctl module show blockchain_module\n```"}, {"execs": [], "md": "## Step 4: Generate a config with bootstrap peers\n\n`generate_user_config` takes a JSON object of arguments. Every field is\noptional \u2014 an empty object produces a working default config. Here we pass\nthe two that matter most for joining a network: the bootstrap peers to sync\nfrom, and the ports to listen on.\n\n`use_persistence_paths` routes the config \u2014 and the node's `state`, `db`\nand `logs` directories \u2014 under the module's own per-instance directory,\nwhich is always writable. That is the safe default."}, {"execs": [{"cmd": "write gen-args.json", "kind": "file", "note": "Wrote gen-args.json", "status": "pass"}], "md": "### 4.1 Write the arguments\n\n```json\n{\n  \"initial_peers\": [\n    \"/ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar\"\n  ],\n  \"net_port\": 3000,\n  \"blend_port\": 3001,\n  \"output\": \"user_config.yaml\",\n  \"use_persistence_paths\": true\n}\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module generate_user_config @gen-args.json", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.2 Generate the config\n\n```bash\nlogosctl call blockchain_module generate_user_config @gen-args.json\n```\n\nThe call returns the absolute path of the file it wrote \u2014 that path is\nwhat you hand to `start`, as the runtime doc-test does.\n\n`output` is worth passing even though it is optional. Omit it and the\ncall still reports success but returns an **empty** path, leaving you\nnothing to start the node with."}, {"execs": [], "md": "## Step 5: Generating a second config into the same instance\n\nA natural next move is to generate a *second* config \u2014 say a peerless one\nwith `skip_ibd: true` \u2014 alongside the first.\n\nThe keystore is created once per instance directory. A second\n`generate_user_config` against the same instance keeps it and writes a new\nconfig next to the first one:"}, {"execs": [{"cmd": "write gen-args-solo.json", "kind": "file", "note": "Wrote gen-args-solo.json", "status": "pass"}], "md": "### 5.1 Write the arguments\n\n```json\n{\n  \"skip_ibd\": true,\n  \"net_port\": 3100,\n  \"blend_port\": 3101,\n  \"output\": \"solo-user-config.yaml\",\n  \"use_persistence_paths\": true\n}\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module generate_user_config @gen-args-solo.json", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.2 Generate a second config\n\n```bash\nlogosctl call blockchain_module generate_user_config @gen-args-solo.json\n```\n\nBoth configs share the keystore, so they share the node identity and\nkeys: they are two ways to run the same node, not two nodes. To get a\nseparate node, use a separate instance directory.\n\n`skip_ibd` is exercised in the companion\n[`blockchain-module-runtime`](./blockchain-module-runtime.md) doc-test,\nwhich generates one config with `skip_ibd: true` and starts a node\nfrom it."}, {"execs": [], "md": "## Step 6: Shut down\n\nStop the daemon. No node was ever started, so there is nothing else to clean up."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.1 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}]}, {"meta": {"name": "Starting and Stopping a Logos Blockchain Node", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Starting and Stopping a Logos Blockchain Node\n\nThis doc-test takes the config produced in\n[`blockchain-module-config`](./blockchain-module-config.md) and actually runs a\nnode with it: start, query the chain state, read the wallet's known addresses,\nand stop again.\n\nIt runs the node **with no bootstrap peers** (`skip_ibd: true`). That is\ndeliberate. A node configured with peers spends its startup trying to fetch a\nchain tip from each one, and if none answer it aborts bootstrap \u2014 so a test\nthat depends on a live network is a test that fails whenever the network moves,\nthe peers rotate, or the node's chainsync protocol version changes. With IBD\nskipped the node comes up against its own genesis state in well under a second\nand every assertion below is deterministic.\n\nWhat that buys you is coverage of the whole local lifecycle: every service\nreaching ready, the wallet initialising, the chain state being queryable, and a\nclean shutdown. What it does not cover is syncing from a real network \u2014 see the\nnote at the end.\n\n**What you'll build:** A running Logos blockchain node, started headlessly from a generated config, queried for its chain and wallet state, and shut down cleanly.\n\n**What you'll learn:**\n\n- How to start and stop a blockchain node through the module's API\n- Which services the node brings up, and what \"ready\" looks like for each\n- How to read chain state with `get_cryptarchia_info`\n- How the wallet exposes its known addresses and their balances\n- How to check for and purge the node's state between runs\n- Why skipping IBD is the right choice for a reproducible test, and what it leaves untested\n\n## Prerequisites\n\n- **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).\n\n- **A Linux or macOS machine.** No display and no network peers are required."}, {"execs": [], "md": "## Step 1: Build the CLI and the module\n\nSame preparation as the [config doc-test](./blockchain-module-config.md):\nthe runtime CLI and this commit of the module packaged as an `.lgx`. Building the `.lgx` compiles the bundled\n`logos_blockchain` native library, so it is the slow step."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "warning: could not update mtime for file '/home/runner/.cache/nix/gitv3/0x42gaghc34fl096fc21wz8bm9rk8kwa094i7sxvvm0q4bgkki0r/refs/heads/master': No such file or directory\nerror:\n       \u2026 while calling the 'derivationStrict' builtin\n         at <nix/derivation-internal.nix>:9:12:\n            8|\n            9|   strict = derivationStrict drvAttrs;\n             |            ^\n           10|\n\n       \u2026 while evaluating derivatio           ^\n           49|\n\n       \u2026 while fetching the input 'git+https://github.com/logos-storage/logos-storage-nim?ref=refs/tags/v0.5.3&rev=56854f4ebce0cfe68e3557d1be21b758ac62ae0c&submodules=1'\n\n       \u2026 while fetching the input 'git+https://github.com/logos-co/nim-libp2p-mix?rev=0883587f1f0d7fc6745e8db00fcd0cb0938d7dd0&submodules=1'\n\n       error: Cannot find Git revision '0883587f1f0d7fc6745e8db00fcd0cb0938d7dd0' in ref 'refs/heads/master' of repository 'https://github.com/logos-co/nim-libp2p-mix'! Please make sure that the rev exists on the ref you've specified or add allRefs = true; to fetchGit.\n", "status": "fail"}], "md": "### 1.1 Build the Logos daemon CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos\n```"}, {"execs": [{"cmd": "nix build 'github:logos-blockchain/logos-blockchain-module/64d8cf5cd4b33b5ef87de31bd96bd2bceae8fb58#lgx' --out-link ./blockchain-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\n", "status": "pass"}], "md": "### 1.2 Build the module's .lgx package\n\n```bash\nnix build 'github:logos-blockchain/logos-blockchain-module/64d8cf5cd4b33b5ef87de31bd96bd2bceae8fb58#lgx' --out-link ./blockchain-lgx\n```"}, {"execs": [], "md": "## Step 2: Start the daemon, install and load the module\n\nRun the daemon, install the package into its session, and load the plugin.\nLoading brings the plugin into the process \u2014 it does **not** start a\nblockchain node."}, {"execs": [{"cmd": "mkdir -p home && HOME=\"$PWD/home\" LOG_BACKEND=file LOG_DIR=$PWD LOG_PATH=node.log ./logos/bin/logosctl --config-dir ./session daemon start --detach", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.1 Start the daemon\n\nThe session directory, `./session`, holds the daemon's config, its\ninstalled modules and their data. `--detach` returns once the daemon\naccepts commands.\n\n```bash\nLOG_BACKEND=file LOG_DIR=$PWD LOG_PATH=node.log logosctl daemon start --detach\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session install --dir ./blockchain-lgx -y", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.2 Install the module\n\n`--dir` installs every `.lgx` in a directory, with no catalog involved.\n`-y` confirms, since there is no terminal to ask on.\n\n```bash\nlogosctl install --dir ./blockchain-lgx -y\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module load blockchain_module", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 2.3 Load the module\n\n```bash\nlogosctl module load blockchain_module\n```"}, {"execs": [], "md": "## Step 3: Confirm the node is not running yet\n\nEvery node-dependent call guards on a running node and reports so plainly.\nThis is worth seeing before starting, because it is the error you will meet\nmost often in practice:"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module get_cryptarchia_info", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 3.1 Ask for chain info with no node\n\n```bash\nlogosctl call blockchain_module get_cryptarchia_info\n```"}, {"execs": [], "md": "## Step 4: Generate a solo config\n\nGenerate a config with no bootstrap peers. `skip_ibd` empties the IBD peer\nlist, so the node will skip Initial Block Download rather than attempt to\nsync from anyone."}, {"execs": [{"cmd": "write runtime-args.json", "kind": "file", "note": "Wrote runtime-args.json", "status": "pass"}], "md": "### 4.1 Write the arguments\n\n```json\n{\n  \"skip_ibd\": true,\n  \"net_port\": 3200,\n  \"blend_port\": 3201,\n  \"output\": \"user_config.yaml\",\n  \"use_persistence_paths\": true\n}\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module generate_user_config @runtime-args.json", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 4.2 Generate it\n\n```bash\nlogosctl call blockchain_module generate_user_config @runtime-args.json\n```\n\n`output` matters here. Omit it and the call still succeeds but returns an\nempty path, leaving you nothing to hand to `start`. Give it a relative\npath and the module resolves it under the instance's persistence\ndirectory and returns the absolute path it wrote."}, {"execs": [{"cmd": "CFG=$(find ./session -name user_config.yaml -path '*blockchain_module*' 2>/dev/null | head -1); echo using $CFG; grep -c 'peers' $CFG || echo 'no peers configured'", "exit_code": 0, "kind": "run", "note": "", "output": "using\n0\nno peers configured\n", "status": "pass"}], "md": "### 4.3 Confirm skip_ibd left no peers to sync from\n\nSince node 0.3.3 a generated config is sparse: it carries only what\ndiffers from the deployment's defaults, so `skip_ibd` shows up as the\n*absence* of any IBD peer list rather than an empty one. The node then\nskips bootstrap rather than try to sync:\n\n```bash\ngrep -c 'peers' <generated>/user_config.yaml || echo 'no peers configured'\n```"}, {"execs": [{"cmd": "CFG=$(find ./session -name user_config.yaml -path '*blockchain_module*' 2>/dev/null | head -1); printf 'cryptarchia:\\n  service:\\n    bootstrap:\\n      prolonged_bootstrap_period: 5s\\n' >> $CFG && grep -n prolonged_bootstrap_period $CFG", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: $CFG: ambiguous redirect\n", "status": "fail"}], "md": "### 4.4 Shorten the bootstrap period\n\nThe node's default `prolonged_bootstrap_period` is an hour: it stays in\n`Bootstrapping` mode for that long before switching to `Online`. That\nis sensible for joining a real network and useless for a test, so\noverride it. `generate_user_config` does not expose this knob, and a\nsparse config omits it, so append the override to the YAML directly.\nDurations are written in humantime form (`5s`, `10m`, `1h`).\n\n```bash\ncat >> <generated>/user_config.yaml <<'EOF'\ncryptarchia:\n  service:\n    bootstrap:\n      prolonged_bootstrap_period: 5s\nEOF\n```"}, {"execs": [], "md": "## Step 5: Start the node\n\n`start` takes the config path and a deployment name. Passing an empty\ndeployment uses the built-in default.\n\nThe node brings its services up in order \u2014 tracing, storage, network,\ncryptarchia, wallet, mempool. Because IBD is skipped there is no bootstrap\nphase to wait through, so `start` returns once the runtime is up."}, {"execs": [{"cmd": "CFG=$(find ./session -name user_config.yaml -path '*blockchain_module*' 2>/dev/null | head -1); ./logos/bin/logosctl --config-dir ./session call blockchain_module start $CFG ''", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 5.1 Start it\n\n```bash\nlogosctl call blockchain_module start <generated>/user_config.yaml \"\"\n```\n\nThe daemon's output records the startup sequence. Three lines are worth\nknowing, because they are the ones that distinguish a healthy peerless\nstart from the failures you meet in practice:\n\n```\nchain::service: genesis time is already in the past: finishing AwaitingGenesisTime phase with no-op\nbootstrap::ibd: Skipping IBD as no peers are configured\nchain_network_service: Initial Block Download completed successfully\n```\n\nThe first confirms the generated config's genesis is already live \u2014 a\nconfig whose genesis is in the *future* parks the node in\n`AwaitingGenesisTime` indefinitely, with no error to explain it. The\nsecond and third are `skip_ibd` doing its job: bootstrap is bypassed\nrather than attempted and failed."}, {"execs": [{"cmd": "sleep 3; sed 's/\\x1b\\[[0-9;]*m//g' node.log | grep -o -E 'genesis time is [a-z ]+(past|future)|genesis_time=.{0,25}|entering [A-Za-z]+|Skipping IBD|ERROR.{0,60}' | uniq | tr '\\n' ';'", "exit_code": 0, "kind": "run", "note": "expected 'genesis time is already in the past' not found in output", "output": "sed: can't read node.log: No such file or directory\n", "status": "fail"}], "md": "### 5.2 Confirm genesis is already live\n\n```bash\ngrep -i genesis node.log\n```"}, {"execs": [], "md": "## Step 6: Query the chain\n\nWith the node up, `get_cryptarchia_info` reports the consensus state: the\ncurrent tip, the last immutable block, and the slot. On a freshly started\nnode with nothing synced, tip and LIB are both genesis."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module get_cryptarchia_info", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.1 Read chain state\n\n```bash\nlogosctl call blockchain_module get_cryptarchia_info\n```\n\nThe reply carries `height`, `slot`, `tip`, `lib` and `mode`. Immediately\nafter start the mode is `Bootstrapping`."}, {"execs": [{"cmd": "sleep 15 && ./logos/bin/logosctl --config-dir ./session call blockchain_module get_cryptarchia_info", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 6.2 Wait for the chain to come Online\n\nAfter the (shortened) prolonged-bootstrap period the mode flips to\n`Online`. This is the transition the blend service is waiting on when it\nlogs *\"Waiting for chain to become Online mode\"*.\n\n```bash\nlogosctl call blockchain_module get_cryptarchia_info\n```\n\nNote `height` and `slot` are still `0`. A node with no peers reaches\n`Online` but does not by itself start producing blocks \u2014 see the closing\nsection."}, {"execs": [], "md": "## Step 7: Read the wallet\n\nThe wallet is initialised from the keystore in the generated config, so it\nknows its addresses immediately \u2014 no sync required. Balances are a separate\nlookup against the ledger, and on an unsynced chain they reflect genesis\nstate only."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module wallet_get_known_addresses", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 7.1 List known addresses\n\n```bash\nlogosctl call blockchain_module wallet_get_known_addresses\n```\n\nFive addresses, returned as a JSON array. These are what the module's UI\nlists in its Accounts panel, and the ones it then queries balances for\none at a time."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module wallet_get_balance \"$(./logos/bin/logosctl --config-dir ./session call blockchain_module wallet_get_known_addresses | grep -o '[0-9a-f]\\{64\\}' | head -1)\"", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 7.2 Ask for a balance before the chain has synced\n\nFeed one of those addresses straight back into `wallet_get_balance`.\nOn a node that has not synced, the call **fails** \u2014 even though the\naddress came from the module's own list a moment earlier:\n\n```bash\nADDR=$(logosctl call blockchain_module wallet_get_known_addresses | grep -o '[0-9a-f]\\{64\\}' | head -1)\nlogosctl call blockchain_module wallet_get_balance \"$ADDR\"\n```\n\nTwo different notions of \"known\" are in play: the wallet holds the\n*key*, but the *ledger* has no entry for that address until the chain\nhas progressed far enough to contain one. The error wording describes\nthe second and reads like the first, which is why it looks \u2014 wrongly \u2014\nlike a malformed address.\n\nThis is asserted here deliberately. It is the current behaviour, it is\nreachable in seconds without a network, and it is the single most\nconfusing thing a new operator meets. If the node later returns `0` or a\ndistinct \"not synced\" error instead, this assertion should fail and be\nupdated \u2014 which is exactly what a doc-test is for."}, {"execs": [], "md": "## Step 8: Stop the node\n\nShut the node down. `stop` is idempotent in the sense that stopping an already-stopped node reports plainly rather than failing hard."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 8.1 Stop it\n\n```bash\nlogosctl call blockchain_module stop\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module get_cryptarchia_info", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 8.2 Confirm it is down\n\n```bash\nlogosctl call blockchain_module get_cryptarchia_info\n```"}, {"execs": [], "md": "## Step 9: Purge the node's state\n\nRunning the node left a state directory behind, under the module's per-instance directory, defined by \n`use_persistence_paths`.\nAn operator who wants to resync from scratch needs it gone, and the UI offers to do that when it is there.\n\n`does_state_exist` is what the UI checks before offering the purge; `purge_state` does the removing. \nThe purge refuses while the node is running, which is why this comes after the stop."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module does_state_exist", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 9.1 Check for existing state\n\n```bash\nlogosctl call blockchain_module does_state_exist\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module purge_state", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 9.2 Purge it\n\nOnly `state` goes. \nThe generated config and the keystore stay, so the node keeps the identity it generated and simply resyncs on \nthe next start.\n\n```bash\nlogosctl call blockchain_module purge_state\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call blockchain_module does_state_exist", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 9.3 Confirm it is gone\n\n```bash\nlogosctl call blockchain_module does_state_exist\n```\n\nThe next start recreates the directory and syncs into it from genesis."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon stop", "exit_code": 127, "kind": "run", "note": "exit code 127", "output": "/nix/store/gik3rh1vz2jlgnifb9dh6vc6sxwwz9jj-bash-5.3p9/bin/sh: line 1: ./logos/bin/logosctl: No such file or directory\n", "status": "fail"}], "md": "### 9.4 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}, {"execs": [], "md": "## What this does not cover\n\nSkipping IBD keeps this doc-test fast and deterministic. What it leaves out\nwas established by running it, not assumed:\n\n- **The chain does not advance.** A peerless node reaches `Online` and then\n  stays at `height: 0`, `slot: 0` indefinitely \u2014 observed over several\n  minutes. Genesis being in the past and bootstrap completing are not\n  sufficient to make a lone node produce blocks. So **block streams,\n  non-zero balances and transfers cannot be asserted here**, and this\n  doc-test does not pretend to.\n- **Syncing from peers.** Bootstrap, block download and the chainsync\n  protocol handshake are never exercised. A node whose peers speak a\n  different chainsync version fails with `AllPeersFailed` \u2014 a real and\n  common failure, reachable only against a live network.\n\nCovering transactions therefore needs either a multi-node fixture or\nwhatever the node uses to make a single node leader-eligible. The node's own\ncucumber suite (`tests/src/cucumber`) already runs manual-node scenarios\nwith deployment overrides such as\n`time.chain_start_time = now_plus_seconds(0)`, and is the better place to\nlook before attempting it here.\n\nTwo knobs that are *not* reachable through `generate_user_config` and had to\nbe patched into the YAML directly \u2014 worth exposing on the FFI if this\npattern is repeated:\n\n- `prolonged_bootstrap_period` (the hour-long `Bootstrapping` hold)\n- `time.chain_start_time` (deployment-side, controls genesis)"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
