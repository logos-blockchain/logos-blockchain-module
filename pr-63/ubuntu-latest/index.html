  * { box-sizing: border-box; }

  .pill.skip { background: rgba(210,153,34,.15); color: var(--info); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }

  .tutorial-title { font-size: 20px; font-weight: 700; margin: 24px 0 8px; color: #fff; }

    border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; overflow: hidden;

  .col { padding: 14px 18px; min-width: 0; }
  .col.left { border-right: 1px solid var(--border); }
  .row.preamble .col.left, .row.section .col.left { border-right: none; }

  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }

  .row.has-fail .col.right { background: rgba(248,81,73,.12); }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }

  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }
  pre.cmd, pre.output { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }

  .heading-anchored { position: relative; scroll-margin-top: 76px; }
  a.anchor {

  .heading-anchored:hover > a.anchor, a.anchor:focus { opacity: 1; }
  a.anchor:hover { color: var(--accent); }
  .heading-anchored.flash { animation: flash 1.4s ease-out; border-radius: 4px; }

    opacity: 0; pointer-events: none; transition: opacity .15s ease-in-out;
  }
  #toast.show { opacity: 1; }
</style>

dir ./modules install --dir ./blockchain-lgx", "status": "pass", "exit_code": 0, "output": "Installing logos-blockchain_module-module-lib.lgx...Warning: Package is unsigned: ./blockchain-lgx/logos-blockchain_module-module-lib.lgx\n done\n\nInstalled 1/1 package(s)\n", "note": ""}]}, {"md": "## Step 4: Load the module in the daemon\n\nStart the daemon pointed at the modules directory, then load\n`blockchain_module`. Loading only brings the plugin into the process \u2014 it\ndoes **not** start a blockchain node.", "execs": []}, {"md": "### 4.1 Start the daemon\n\n```bash\nlogoscore daemon --modules-dir ./modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore daemon --modules-dir ./modules >/dev/null 2>&1 &", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 4.2 Load the module\n\n```bash\nlogoscore load-module blockchain_module\n```", "execs": [{"kind": "run", "cmd": "sleep 8; ./logos/bin/logoscore load-module blockchain_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"blockchain_module\",\"status\":\"ok\",\"version\":\"0.0.999\"}\n", "note": ""}]}, {"md": "### 4.3 Inspect the methods it exposes\n\n`module-info` lists the `Q_INVOKABLE` methods \u2014 the same names you can\n`call`. Note `generate_user_config`, `start`, `stop`, and the\n`wallet_*` family:\n\n```bash\nlogoscore module-info blockchain_module\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore module-info blockchain_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies\":[],\"dependents\":[],\"events\":[{\"name\":\"newBlock\",\"parameters\":[{\"name\":\"blockJson\",\"type\":\"QString\"}],\"signature\":\"newBlock(QString)\",\"type\":\"event\"},{\"name\":\"processedBlock\",\"parameters\":[{\"name\":\"eventJson\",\"type\":\"QString\"}],\"signature\":\"processedBlock(QString)\",\"type\":\"event\"},{\"name\":\"libBlock\",\"parameters\":[{\"name\":\"blockInfoJson\",\"type\":\"QString\"}],\"signature\":\"libBlock(QString)\",\"type\":\"event\"}],\"methods\":[{\"isInvokable\":true,\"name\":\"start\",\"parameters\":[{\"name\":\"config_path\",\"type\":\"QString\"},{\"name\":\"deployment\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"start(QString,QString)\"},{\"isInvokable\":true,\"name\":\"stop\",\"returnType\":\"LogosResult\",\"signature\":\"stop()\"},{\"isInvokable\":true,\"name\":\"generate_user_config\",\"parameters\":[{\"name\":\"json_args\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"generate_user_config(QString)\"},{\"isInvokable\":true,\"name\":\"update_user_config\",\"parameters\":[{\"name\":\"user_config_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"update_user_config(QString,QString)\"},{\"isInvokable\":true,\"name\":\"migrate_user_config\",\"parameters\":[{\"name\":\"output_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"migrate_user_config(QString,QString)\"},{\"isInvokable\":true,\"name\":\"migrate_user_config_0_1_2\",\"parameters\":[{\"name\":\"new_config_path\",\"type\":\"QString\"},{\"name\":\"old_config_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"migrate_user_config_0_1_2(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"participate\",\"parameters\":[{\"name\":\"config_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"},{\"name\":\"output_dir\",\"type\":\"QString\"},{\"name\":\"external_address\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"participate(QString,QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"generate_key\",\"parameters\":[{\"name\":\"user_config_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"},{\"name\":\"key_type\",\"type\":\"QString\"},{\"name\":\"key_title\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"generate_key(QString,QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"add_key\",\"parameters\":[{\"name\":\"user_config_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"},{\"name\":\"key_type\",\"type\":\"QString\"},{\"name\":\"key_hex\",\"type\":\"QString\"},{\"name\":\"key_title\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"add_key(QString,QString,QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"remove_key\",\"parameters\":[{\"name\":\"user_config_path\",\"type\":\"QString\"},{\"name\":\"keystore_path\",\"type\":\"QString\"},{\"name\":\"key_title\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"remove_key(QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"get_peer_id\",\"parameters\":[{\"name\":\"config_path\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"get_peer_id(QString)\"},{\"isInvokable\":true,\"name\":\"wallet_get_balance\",\"parameters\":[{\"name\":\"address_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"wallet_get_balance(QString)\"},{\"isInvokable\":true,\"name\":\"wallet_transfer_funds\",\"parameters\":[{\"name\":\"change_public_key\",\"type\":\"QString\"},{\"name\":\"sender_addresses\",\"type\":\"QStringList\"},{\"name\":\"recipient_address\",\"type\":\"QString\"},{\"name\":\"amount\",\"type\":\"QString\"},{\"name\":\"optional_tip_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"wallet_transfer_funds(QString,QStringList,QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"wallet_get_known_addresses\",\"returnType\":\"LogosResult\",\"signature\":\"wallet_get_known_addresses()\"},{\"isInvokable\":true,\"name\":\"wallet_get_notes\",\"parameters\":[{\"name\":\"wallet_address_hex\",\"type\":\"QString\"},{\"name\":\"optional_tip_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"wallet_get_notes(QString,QString)\"},{\"isInvokable\":true,\"name\":\"leader_claim\",\"returnType\":\"LogosResult\",\"signature\":\"leader_claim()\"},{\"isInvokable\":true,\"name\":\"wallet_get_claimable_vouchers\",\"returnType\":\"LogosResult\",\"signature\":\"wallet_get_claimable_vouchers()\"},{\"isInvokable\":true,\"name\":\"wallet_fund_tx\",\"parameters\":[{\"name\":\"request_json\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"wallet_fund_tx(QString)\"},{\"isInvokable\":true,\"name\":\"submit_signed_transaction\",\"parameters\":[{\"name\":\"signed_tx_json\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"submit_signed_transaction(QString)\"},{\"isInvokable\":true,\"name\":\"channel_deposit\",\"parameters\":[{\"name\":\"channel_id_hex\",\"type\":\"QString\"},{\"name\":\"funding_public_key_hex\",\"type\":\"QString\"},{\"name\":\"amount\",\"type\":\"QString\"},{\"name\":\"metadata_hex\",\"type\":\"QString\"},{\"name\":\"optional_tip_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"channel_deposit(QString,QString,QString,QString,QString)\"},{\"isInvokable\":true,\"name\":\"channel_deposit_with_notes\",\"parameters\":[{\"name\":\"channel_id_hex\",\"type\":\"QString\"},{\"name\":\"input_note_id_hexes\",\"type\":\"QStringList\"},{\"name\":\"metadata_hex\",\"type\":\"QString\"},{\"name\":\"change_public_key_hex\",\"type\":\"QString\"},{\"name\":\"funding_public_key_hexes\",\"type\":\"QStringList\"},{\"name\":\"max_tx_fee\",\"type\":\"QString\"},{\"name\":\"optional_tip_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"channel_deposit_with_notes(QString,QStringList,QString,QString,QStringList,QString,QString)\"},{\"isInvokable\":true,\"name\":\"get_channel_state\",\"parameters\":[{\"name\":\"channel_id_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"get_channel_state(QString)\"},{\"isInvokable\":true,\"name\":\"blend_join_as_core_node\",\"parameters\":[{\"name\":\"locator\",\"type\":\"QString\"},{\"name\":\"locked_note_id_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"blend_join_as_core_node(QString,QString)\"},{\"isInvokable\":true,\"name\":\"get_block\",\"parameters\":[{\"name\":\"header_id_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"get_block(QString)\"},{\"isInvokable\":true,\"name\":\"get_blocks\",\"parameters\":[{\"name\":\"from_slot\",\"type\":\"int\"},{\"name\":\"to_slot\",\"type\":\"int\"}],\"returnType\":\"LogosResult\",\"signature\":\"get_blocks(int,int)\"},{\"isInvokable\":true,\"name\":\"get_transaction\",\"parameters\":[{\"name\":\"tx_hash_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"get_transaction(QString)\"},{\"isInvokable\":true,\"name\":\"get_cryptarchia_info\",\"returnType\":\"LogosResult\",\"signature\":\"get_cryptarchia_info()\"},{\"isInvokable\":true,\"name\":\"get_block_events\",\"parameters\":[{\"name\":\"header_id_hex\",\"type\":\"QString\"}],\"returnType\":\"LogosResult\",\"signature\":\"get_block_events(QString)\"},{\"isInvokable\":true,\"name\":\"get_time_info\",\"returnType\":\"LogosResult\",\"signature\":\"get_time_info()\"}],\"name\":\"blockchain_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.0.999\"}\n", "note": ""}]}, {"md": "## Step 5: Generate a config with bootstrap peers\n\n`generate_user_config` takes a JSON object of arguments. Every field is\noptional \u2014 an empty object produces a working default config. Here we pass\nthe two that matter most for joining a network: the bootstrap peers to sync\nfrom, and the ports to listen on.\n\n`use_persistence_paths` routes the config \u2014 and the node's `state`, `db`\nand `logs` directories \u2014 under the module's own per-instance directory,\nwhich is always writable. That is the safe default.", "execs": []}, {"md": "### 5.1 Write the arguments\n\n```json\n{\n  \"initial_peers\": [\n    \"/ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar\"\n  ],\n  \"net_port\": 3000,\n  \"blend_port\": 3001,\n  \"output\": \"peered/user_config.yaml\",\n  \"use_persistence_paths\": true\n}\n```", "execs": [{"kind": "file", "cmd": "write gen-args.json", "status": "pass", "note": "Wrote gen-args.json"}]}, {"md": "### 5.2 Generate the config\n\n```bash\nlogoscore call blockchain_module generate_user_config @gen-args.json\n```\n\nThe call returns the absolute path of the file it wrote \u2014 that path is\nwhat you hand to `start`, as the runtime doc-test does.\n\n`output` is worth passing even though it is optional. Omit it and the\ncall still reports success but returns an **empty** path, leaving you\nnothing to start the node with.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module generate_user_config @gen-args.json", "status": "fail", "exit_code": 0, "output": "{\"method\":\"generate_user_config\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"Error generating config: No such file or directory (os error 2)\\n\\nLocation:\\n    nodes/node/binary/src/cli/config/init.rs:56:5\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"success\":true' not found in output"}]}, {"md": "## Step 6: Generate a config with no bootstrap peers\n\nPassing `skip_ibd: true` leaves the Initial Block Download peer list empty\n**regardless of any peers passed** \u2014 the node then skips IBD entirely rather\nthan trying to sync.\n\nThis is the configuration you want for an offline or single-node run: no\npeers to reach, no bootstrap to wait for. It is also what makes this module\ntestable without a live network, since a node with peers configured will\nfail bootstrap outright if none of them are reachable or speak a matching\nchainsync protocol version.", "execs": []}, {"md": "### 6.1 Write the arguments\n\n```json\n{\n  \"skip_ibd\": true,\n  \"net_port\": 3100,\n  \"blend_port\": 3101,\n  \"output\": \"solo/user_config.yaml\",\n  \"use_persistence_paths\": true\n}\n```", "execs": [{"kind": "file", "cmd": "write gen-args-solo.json", "status": "pass", "note": "Wrote gen-args-solo.json"}]}, {"md": "### 6.2 Generate the solo config\n\n```bash\nlogoscore call blockchain_module generate_user_config @gen-args-solo.json\n```\n\n`output` was given as a *relative* path, so the module resolves it under\nthe same per-instance base: the config lands at\n`<persistence>/solo/user_config.yaml`. An absolute path would be written\nverbatim and would disable the persistence routing entirely.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module generate_user_config @gen-args-solo.json", "status": "fail", "exit_code": 0, "output": "{\"method\":\"generate_user_config\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"Error generating config: No such file or directory (os error 2)\\n\\nLocation:\\n    nodes/node/binary/src/cli/config/init.rs:56:5\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"success\":true' not found in output"}]}, {"md": "## Step 7: Shut down\n\nStop the daemon. No node was ever started, so there is nothing else to clean up.", "execs": []}, {"md": "### 7.1 Stop the daemon\n\n```bash\nlogoscore stop\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}]}, {"meta": {"name": "Starting and Stopping a Logos Blockchain Node", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"md": "# Starting and Stopping a Logos Blockchain Node\n\nThis doc-test takes the config produced in\n[`blockchain-module-config`](./blockchain-module-config.md) and actually runs a\nnode with it: start, query the chain state, read the wallet's known addresses,\nand stop again.\n\nIt runs the node **with no bootstrap peers** (`skip_ibd: true`). That is\ndeliberate. A node configured with peers spends its startup trying to fetch a\nchain tip from each one, and if none answer it aborts bootstrap \u2014 so a test\nthat depends on a live network is a test that fails whenever the network moves,\nthe peers rotate, or the node's chainsync protocol version changes. With IBD\nskipped the node comes up against its own genesis state in well under a second\nand every assertion below is deterministic.\n\nWhat that buys you is coverage of the whole local lifecycle: every service\nreaching ready, the wallet initialising, the chain state being queryable, and a\nclean shutdown. What it does not cover is syncing from a real network \u2014 see the\nnote at the end.\n\n**What you'll build:** A running Logos blockchain node, started headlessly from a generated config, queried for its chain and wallet state, and shut down cleanly.\n\n**What you'll learn:**\n\n- How to start and stop a blockchain node through the module's API\n- Which services the node brings up, and what \"ready\" looks like for each\n- How to read chain state with `get_cryptarchia_info`\n- How the wallet exposes its known addresses and their balances\n- Why skipping IBD is the right choice for a reproducible test, and what it leaves untested\n\n## Prerequisites\n\n- **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).\n\n- **A Linux or macOS machine.** No display and no network peers are required.", "execs": []}, {"md": "## Step 1: Build the tools and install the module\n\nSame preparation as the [config doc-test](./blockchain-module-config.md):\nthe runtime CLI, the package manager, and this commit of the module\npackaged as an `.lgx`. Building the `.lgx` compiles the bundled\n`logos_blockchain` native library, so it is the slow step.", "execs": []}, {"md": "### 1.1 Build the Logos daemon CLI\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 1.2 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager' --out-link ./lgpm\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-co/logos-package-manager' --out-link ./lgpm", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 1.3 Build the module's .lgx package\n\n```bash\nnix build 'github:logos-blockchain/logos-blockchain-module/f5868dd998a2ee73c153ab0d8bab1f05969a0665#lgx' --out-link ./blockchain-lgx\n```", "execs": [{"kind": "run", "cmd": "nix build 'github:logos-blockchain/logos-blockchain-module/f5868dd998a2ee73c153ab0d8bab1f05969a0665#lgx' --out-link ./blockchain-lgx", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 1.4 Install it into a modules directory\n\n```bash\nlgpm --modules-dir ./modules install --dir ./blockchain-lgx\n```", "execs": [{"kind": "run", "cmd": "./lgpm/bin/lgpm --modules-dir ./modules install --dir ./blockchain-lgx", "status": "pass", "exit_code": 0, "output": "Installing logos-blockchain_module-module-lib.lgx...Warning: Package is unsigned: ./blockchain-lgx/logos-blockchain_module-module-lib.lgx\n done\n\nInstalled 1/1 package(s)\n", "note": ""}]}, {"md": "## Step 2: Start the daemon and load the module\n\nRun the daemon and load the plugin. Loading brings the plugin into the\nprocess \u2014 it does **not** start a blockchain node.", "execs": []}, {"md": "### 2.1 Start the daemon\n\n```bash\nlogoscore daemon --modules-dir ./modules\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore daemon --modules-dir ./modules >/dev/null 2>&1 &", "status": "pass", "exit_code": 0, "output": "", "note": ""}]}, {"md": "### 2.2 Load the module\n\n```bash\nlogoscore load-module blockchain_module\n```", "execs": [{"kind": "run", "cmd": "sleep 8; ./logos/bin/logoscore load-module blockchain_module", "status": "pass", "exit_code": 0, "output": "{\"dependencies_loaded\":[],\"module\":\"blockchain_module\",\"status\":\"ok\",\"version\":\"0.0.999\"}\n", "note": ""}]}, {"md": "## Step 3: Confirm the node is not running yet\n\nEvery node-dependent call guards on a running node and reports so plainly.\nThis is worth seeing before starting, because it is the error you will meet\nmost often in practice:", "execs": []}, {"md": "### 3.1 Ask for chain info with no node\n\n```bash\nlogoscore call blockchain_module get_cryptarchia_info\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module get_cryptarchia_info", "status": "pass", "exit_code": 0, "output": "{\"method\":\"get_cryptarchia_info\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": ""}]}, {"md": "## Step 4: Generate a solo config\n\nGenerate a config with no bootstrap peers. `skip_ibd` empties the IBD peer\nlist, so the node will skip Initial Block Download rather than attempt to\nsync from anyone.", "execs": []}, {"md": "### 4.1 Write the arguments\n\n```json\n{\n  \"skip_ibd\": true,\n  \"net_port\": 3200,\n  \"blend_port\": 3201,\n  \"output\": \"user_config.yaml\",\n  \"use_persistence_paths\": true\n}\n```", "execs": [{"kind": "file", "cmd": "write runtime-args.json", "status": "pass", "note": "Wrote runtime-args.json"}]}, {"md": "### 4.2 Generate it\n\n```bash\nlogoscore call blockchain_module generate_user_config @runtime-args.json\n```\n\n`output` matters here. Omit it and the call still succeeds but returns an\nempty path, leaving you nothing to hand to `start`. Give it a relative\npath and the module resolves it under the instance's persistence\ndirectory and returns the absolute path it wrote.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module generate_user_config @runtime-args.json", "status": "pass", "exit_code": 0, "output": "{\"method\":\"generate_user_config\",\"module\":\"blockchain_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"/tmp/doctest-test-52v8u4ft/.logoscore/data/blockchain_module/2920f849d193/user_config.yaml\"},\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 4.3 Confirm skip_ibd emptied the peer list\n\n`skip_ibd` writes an empty IBD peer list into the config, which is what\nmakes the node skip bootstrap rather than try to sync:\n\n```bash\ngrep -A1 'ibd:' <generated>/user_config.yaml\n```", "execs": [{"kind": "run", "cmd": "grep -A1 'ibd:' \"$(ls -d ./data/blockchain_module/*/)user_config.yaml\"", "status": "fail", "exit_code": 2, "output": "ls: cannot access './data/blockchain_module/*/': No such file or directory\ngrep: user_config.yaml: No such file or directory\n", "note": "exit code 2"}]}, {"md": "### 4.4 Shorten the bootstrap period\n\nA generated config carries `prolonged_bootstrap_period: '3600.000000000'`\n\u2014 the node stays in `Bootstrapping` mode for a full hour before\nswitching to `Online`. That is sensible for joining a real network and\nuseless for a test, so patch it down. `generate_user_config` does not\nexpose this knob, so we edit the YAML directly.\n\n```bash\n# sed -i differs between GNU and BSD/macOS, so write and move instead.\nsed \"s/prolonged_bootstrap_period: '3600.000000000'/prolonged_bootstrap_period: '5.000000000'/\" \\\n  <generated>/user_config.yaml > tmp && mv tmp <generated>/user_config.yaml\n```", "execs": [{"kind": "run", "cmd": "CFG=\"$(ls -d ./data/blockchain_module/*/)user_config.yaml\"; sed \"s/prolonged_bootstrap_period: '3600.000000000'/prolonged_bootstrap_period: '5.000000000'/\" \"$CFG\" > \"$CFG.tmp\" && mv \"$CFG.tmp\" \"$CFG\" && grep -n prolonged_bootstrap_period \"$CFG\"", "status": "fail", "exit_code": 2, "output": "ls: cannot access './data/blockchain_module/*/': No such file or directory\nsed: can't read user_config.yaml: No such file or directory\n", "note": "exit code 2"}]}, {"md": "## Step 5: Start the node\n\n`start` takes the config path and a deployment name. Passing an empty\ndeployment uses the built-in default.\n\nThe node brings its services up in order \u2014 tracing, storage, network,\ncryptarchia, wallet, mempool. Because IBD is skipped there is no bootstrap\nphase to wait through, so `start` returns once the runtime is up.", "execs": []}, {"md": "### 5.1 Start it\n\n```bash\nlogoscore call blockchain_module start <generated>/user_config.yaml \"\"\n```\n\nThe daemon's output records the startup sequence. Three lines are worth\nknowing, because they are the ones that distinguish a healthy peerless\nstart from the failures you meet in practice:\n\n```\nchain::service: genesis time is already in the past: finishing AwaitingGenesisTime phase with no-op\nbootstrap::ibd: Skipping IBD as no peers are configured\nchain_network_service: Initial Block Download completed successfully\n```\n\nThe first confirms the generated config's genesis is already live \u2014 a\nconfig whose genesis is in the *future* parks the node in\n`AwaitingGenesisTime` indefinitely, with no error to explain it. The\nsecond and third are `skip_ibd` doing its job: bootstrap is bypassed\nrather than attempted and failed.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module start \"$(ls -d ./data/blockchain_module/*/)user_config.yaml\" \"\"", "status": "fail", "exit_code": 0, "output": "ls: cannot access './data/blockchain_module/*/': No such file or directory\n{\"method\":\"start\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"Could not parse config file: No such file or directory (os error 2)\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"success\":true' not found in output"}]}, {"md": "## Step 6: Query the chain\n\nWith the node up, `get_cryptarchia_info` reports the consensus state: the\ncurrent tip, the last immutable block, and the slot. On a freshly started\nnode with nothing synced, tip and LIB are both genesis.", "execs": []}, {"md": "### 6.1 Read chain state\n\n```bash\nlogoscore call blockchain_module get_cryptarchia_info\n```\n\nThe reply carries `height`, `slot`, `tip`, `lib` and `mode`. Immediately\nafter start the mode is `Bootstrapping`.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module get_cryptarchia_info", "status": "fail", "exit_code": 0, "output": "{\"method\":\"get_cryptarchia_info\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"success\":true' not found in output"}]}, {"md": "### 6.2 Wait for the chain to come Online\n\nAfter the (shortened) prolonged-bootstrap period the mode flips to\n`Online`. This is the transition the blend service is waiting on when it\nlogs *\"Waiting for chain to become Online mode\"*.\n\n```bash\nlogoscore call blockchain_module get_cryptarchia_info\n```\n\nNote `height` and `slot` are still `0`. A node with no peers reaches\n`Online` but does not by itself start producing blocks \u2014 see the closing\nsection.", "execs": [{"kind": "run", "cmd": "sleep 15 && ./logos/bin/logoscore call blockchain_module get_cryptarchia_info", "status": "fail", "exit_code": 0, "output": "{\"method\":\"get_cryptarchia_info\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"mode\\\":\\\"Online' not found in output"}]}, {"md": "## Step 7: Read the wallet\n\nThe wallet is initialised from the keystore in the generated config, so it\nknows its addresses immediately \u2014 no sync required. Balances are a separate\nlookup against the ledger, and on an unsynced chain they reflect genesis\nstate only.", "execs": []}, {"md": "### 7.1 List known addresses\n\n```bash\nlogoscore call blockchain_module wallet_get_known_addresses\n```\n\nFive addresses, returned as a JSON array. These are what the module's UI\nlists in its Accounts panel, and the ones it then queries balances for\none at a time.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module wallet_get_known_addresses", "status": "fail", "exit_code": 0, "output": "{\"method\":\"wallet_get_known_addresses\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"success\":true' not found in output"}]}, {"md": "### 7.2 Ask for a balance before the chain has synced\n\nFeed one of those addresses straight back into `wallet_get_balance`.\nOn a node that has not synced, the call **fails** \u2014 even though the\naddress came from the module's own list a moment earlier:\n\n```bash\nADDR=$(logoscore call blockchain_module wallet_get_known_addresses | grep -o '[0-9a-f]\\{64\\}' | head -1)\nlogoscore call blockchain_module wallet_get_balance \"$ADDR\"\n```\n\nTwo different notions of \"known\" are in play: the wallet holds the\n*key*, but the *ledger* has no entry for that address until the chain\nhas progressed far enough to contain one. The error wording describes\nthe second and reads like the first, which is why it looks \u2014 wrongly \u2014\nlike a malformed address.\n\nThis is asserted here deliberately. It is the current behaviour, it is\nreachable in seconds without a network, and it is the single most\nconfusing thing a new operator meets. If the node later returns `0` or a\ndistinct \"not synced\" error instead, this assertion should fail and be\nupdated \u2014 which is exactly what a doc-test is for.", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module wallet_get_balance \"$(./logos/bin/logoscore call blockchain_module wallet_get_known_addresses | grep -o '[0-9a-f]\\{64\\}' | head -1)\"", "status": "fail", "exit_code": 0, "output": "{\"method\":\"wallet_get_balance\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected 'Unknown wallet address.' not found in output"}]}, {"md": "## Step 8: Stop the node\n\nShut the node down. `stop` is idempotent in the sense that stopping an already-stopped node reports plainly rather than failing hard.", "execs": []}, {"md": "### 8.1 Stop it\n\n```bash\nlogoscore call blockchain_module stop\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module stop", "status": "fail", "exit_code": 0, "output": "{\"method\":\"stop\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": "expected '\"success\":true' not found in output"}]}, {"md": "### 8.2 Confirm it is down\n\n```bash\nlogoscore call blockchain_module get_cryptarchia_info\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore call blockchain_module get_cryptarchia_info", "status": "pass", "exit_code": 0, "output": "{\"method\":\"get_cryptarchia_info\",\"module\":\"blockchain_module\",\"result\":{\"error\":\"The node is not running.\",\"success\":false,\"value\":null},\"status\":\"ok\"}\n", "note": ""}]}, {"md": "### 8.3 Stop the daemon\n\n```bash\nlogoscore stop\n```", "execs": [{"kind": "run", "cmd": "./logos/bin/logoscore stop", "status": "pass", "exit_code": 0, "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "note": ""}]}, {"md": "## What this does not cover\n\nSkipping IBD keeps this doc-test fast and deterministic. What it leaves out\nwas established by running it, not assumed:\n\n- **The chain does not advance.** A peerless node reaches `Online` and then\n  stays at `height: 0`, `slot: 0` indefinitely \u2014 observed over several\n  minutes. Genesis being in the past and bootstrap completing are not\n  sufficient to make a lone node produce blocks. So **block streams,\n  non-zero balances and transfers cannot be asserted here**, and this\n  doc-test does not pretend to.\n- **Syncing from peers.** Bootstrap, block download and the chainsync\n  protocol handshake are never exercised. A node whose peers speak a\n  different chainsync version fails with `AllPeersFailed` \u2014 a real and\n  common failure, reachable only against a live network.\n\nCovering transactions therefore needs either a multi-node fixture or\nwhatever the node uses to make a single node leader-eligible. The node's own\ncucumber suite (`tests/src/cucumber`) already runs manual-node scenarios\nwith deployment overrides such as\n`time.chain_start_time = now_plus_seconds(0)`, and is the better place to\nlook before attempting it here.\n\nTwo knobs that are *not* reachable through `generate_user_config` and had to\nbe patched into the YAML directly \u2014 worth exposing on the FFI if this\npattern is repeated:\n\n- `prolonged_bootstrap_period` (the hour-long `Bootstrapping` hold)\n- `time.chain_start_time` (deployment-side, controls genesis)", "execs": []}]}]}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
